name: noprofit.space 自动登录

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 执行（北京时间早8点）
  workflow_dispatch:      # 支持手动触发

jobs:
  auto-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 代理+Cloudflare验证需要更长时间
    env:
      TZ: Asia/Shanghai  # 设置时区为北京时间

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🌐 启动 GOST 代理隧道
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "${GOST_PROXY}" ]; then
            echo "❌ 致命错误: 未在仓库配置 secrets.GOST_PROXY"
            exit 1
          fi
          echo "⬇️ 获取 GOST 最新版本并下载..."
          GOST_VERSION=$(curl -s https://api.github.com/repos/go-gost/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $GOST_VERSION"
          wget -q "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          tar -xzf gost_${GOST_VERSION}_linux_amd64.tar.gz
          chmod +x ./gost
          echo "🚀 启动 GOST 本地转发 (SOCKS5 服务端口: 40000)..."
          nohup ./gost -L socks5://:40000 -F "${GOST_PROXY}" > gost.log 2>&1 &
          sleep 10  # 加长等待时间，确保代理完全启动
          echo "🔍 测试 GOST 代理连接状态..."
          EXIT_IP=$(curl -s --max-time 15 --retry 3 --retry-delay 2 --proxy socks5://127.0.0.1:40000 https://api.ipify.org || true)
          if [ -z "${EXIT_IP}" ]; then
            echo "❌ 代理隧道连接失败，正在打印 gost 日志..."
            cat gost.log
            exit 1
          fi
          echo "✅ GOST 代理隧道已就绪，当前代理出口 IP: ${EXIT_IP}"
          echo "EXIT_IP=${EXIT_IP}" >> $GITHUB_ENV

      - name: 📦 安装依赖和浏览器
        run: |
          npm ci
          # 安装 Chromium 及全部系统依赖
          npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright

      - name: 🔑 配置登录凭证
        run: |
          echo "NOPROFIT_USERNAME=${{ secrets.NOPROFIT_USERNAME }}" >> .env
          echo "NOPROFIT_PASSWORD=${{ secrets.NOPROFIT_PASSWORD }}" >> .env
          echo "PROXY_SERVER=socks5://127.0.0.1:40000" >> .env

      - name: 🚀 执行自动登录脚本
        id: login
        run: |
          set -e
          npm start 2>&1 | tee login-output.log
          echo "login_success=true" >> $GITHUB_OUTPUT
        # 即使失败也继续执行后续上传步骤
        continue-on-error: true

      - name: ✅ 判断登录结果
        id: result
        run: |
          if grep -q "🎉 所有操作完成！登录成功" login-output.log; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "登录成功 ✅"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "登录失败 ❌"
          fi

      - name: 📢 发送企业微信结果通知
        if: always() && env.WECOM_WEBHOOK != ''
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          LOGIN_STATUS: ${{ steps.result.outputs.status }}
          EXIT_IP: ${{ env.EXIT_IP }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_TIME: ${{ vars.RUN_TIME || '' }}
        run: |
          # 获取北京时间
          RUN_TIME=$(TZ="Asia/Shanghai" date "+%Y-%m-%d %H:%M:%S")
          if [ "$LOGIN_STATUS" = "success" ]; then
            MSG_TITLE="✅ noprofit 自动登录成功"
            MSG_COLOR="info"
            MSG_CONTENT="出口IP: ${EXIT_IP}\n运行时间: ${RUN_TIME}\n[点击查看运行详情和操作视频](${RUN_URL})"
          else
            MSG_TITLE="❌ noprofit 自动登录失败"
            MSG_COLOR="warning"
            MSG_CONTENT="出口IP: ${EXIT_IP}\n运行时间: ${RUN_TIME}\n[点击查看错误截图和操作视频排查问题](${RUN_URL})"
          fi
          
          echo "📤 正在发送企业微信通知..."
          curl -s -X POST "${WECOM_WEBHOOK}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## ${MSG_TITLE}\n>${MSG_CONTENT}\"
              }
            }"
          echo "✅ 通知已发送"

      - name: 📤 上传操作录制、截图和日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-recording-${{ github.run_id }}
          path: |
            recordings/
            gost.log
            login-output.log
            storage-state.json
          retention-days: 30
          if-no-files-found: warn

      - name: 📝 写入运行摘要
        if: always()
        run: |
          echo "## 🚀 noprofit 自动登录运行结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 运行状态: ${{ steps.result.outputs.status == 'success' && '✅ 成功' || '❌ 失败' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 代理出口IP: `${{ env.EXIT_IP || '未知' }}`" >> $GITHUB_STEP_SUMMARY
          echo "- 运行时间: $(TZ="Asia/Shanghai" date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_STEP_SUMMARY
          echo "- 操作视频和截图请下载下方 Artifact 查看" >> $GITHUB_STEP_SUMMARY
