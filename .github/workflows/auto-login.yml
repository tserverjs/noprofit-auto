name: 自动登录 noprofit.space

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点（北京时间 8 点）执行一次
  workflow_dispatch:  # 允许手动触发
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动测试运行'

jobs:
  auto-login:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 安装 npm 依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          
      - name: 🦊 安装 Camoufox 反检测浏览器（含系统依赖）
        id: camoufox-install
        run: |
          echo "🔍 检查 Camoufox 浏览器缓存..."
          CAMOFOX_CACHE_DIR="$HOME/.cache/camoufox"
          INSTALL_CAMOFOX=true
          if [ -f "${CAMOFOX_CACHE_DIR}/version.json" ]; then
            echo "✅ Camoufox 浏览器已在缓存中，无需重新下载"
            INSTALL_CAMOFOX=false
          fi
          
          if [ "$INSTALL_CAMOFOX" = "true" ]; then
            echo "⬇️ 下载 Camoufox 反检测浏览器二进制..."
            npx camoufox-js fetch
          fi
          
          echo "🔧 安装 Firefox 运行所需系统依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libdbus-1-3 libgtk-3-0 libgbm1 libasound2t64 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxi6 libxtst6 libnss3 libcups2 libxss1 libxrandr2 \
            libpangocairo-1.0-0 libatk1.0-0 libcairo-gobject2 \
            libgdk-pixbuf2.0-0 libpango-1.0-0 libcairo2 \
            libatspi2.0-0 libdrm2 libxkbcommon0 libxshmfence1 \
            fonts-liberation fonts-noto-cjk ca-certificates
          
          echo "🔍 验证 Camoufox 二进制..."
          if [ ! -f "${CAMOFOX_CACHE_DIR}/camoufox-bin/camoufox-bin" ] && [ ! -f "${CAMOFOX_CACHE_DIR}/camoufox-bin/firefox" ]; then
            echo "❌ Camoufox 二进制缺失，强制重新下载..."
            npx camoufox-js fetch
          fi
          
          echo "✅ Camoufox 反检测浏览器环境就绪"

      - name: 🚀 启动 GOST 代理隧道
        id: gost
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "${GOST_PROXY}" ]; then
            echo "❌ 致命错误: 未在仓库配置 secrets.GOST_PROXY"
            exit 1
          fi
          echo "⬇️ 获取 GOST 最新版本并下载..."
          GOST_VERSION=$(curl -s --noproxy "*" https://api.github.com/repos/go-gost/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $GOST_VERSION"
          wget -q "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          tar -xzf gost_${GOST_VERSION}_linux_amd64.tar.gz
          chmod +x ./gost
          echo "🚀 启动 GOST 本地转发 (SOCKS5 服务端口: 40000)..."
          nohup ./gost -L socks5://:40000 -F "${GOST_PROXY}" > gost.log 2>&1 &
          sleep 10
          echo "🔍 测试 GOST 代理连接状态..."
          EXIT_IP=""
          for i in 1 2 3; do
            EXIT_IP=$(curl -s --max-time 10 --proxy socks5://127.0.0.1:40000 https://api.ipify.org || true)
            if [ -n "$EXIT_IP" ]; then
              break
            fi
            echo "⏳ 第 $i 次测试失败，等待 3 秒重试..."
            sleep 3
          done
          if [ -z "${EXIT_IP}" ]; then
            echo "❌ 代理隧道连接失败，正在打印 gost 日志..."
            cat gost.log
            exit 1
          fi
          echo "EXIT_IP=${EXIT_IP}" >> $GITHUB_OUTPUT
          echo "✅ GOST 代理隧道已就绪，当前代理出口 IP: ${EXIT_IP}"

      - name: ▶️ 执行自动登录（Camoufox 反检测引擎）
        id: run-login
        env:
          NOPROFIT_USERNAME: ${{ secrets.NOPROFIT_USERNAME }}
          NOPROFIT_PASSWORD: ${{ secrets.NOPROFIT_PASSWORD }}
          PROXY_SERVER: socks5://127.0.0.1:40000
          TZ: Asia/Shanghai
        run: |
          mkdir -p recordings
          echo "📝 开始执行自动登录脚本（Camoufox C++级反检测）..."
          node login.js 2>&1 | tee login-output.log
          LOGIN_SUCCESS=false
          if grep -q "🎉 所有操作完成！登录成功" login-output.log; then
            LOGIN_SUCCESS=true
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ 登录成功"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ 登录失败"
            exit 0
          fi

      - name: 📊 输出运行结果到 GitHub 摘要
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M:%S")
          STATUS="${{ steps.run-login.outputs.status }}"
          EXIT_IP="${{ steps.gost.outputs.EXIT_IP }}"
          echo "## 🔑 noprofit 自动登录结果" >> $GITHUB_STEP_SUMMARY
          echo "- 🦊 浏览器引擎: Camoufox (C++级反检测 Firefox)" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ 运行时间: ${RUN_TIME} (北京时间)" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 代理出口 IP: ${EXIT_IP}" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "success" ]; then
            echo "- 🎉 登录结果: ✅ 成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🎉 登录结果: ❌ 失败" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 🔗 运行详情: [点击查看](${RUN_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- 🎥 操作录制: 请下载下方 artifacts 查看完整操作视频和截图" >> $GITHUB_STEP_SUMMARY

      - name: 📤 发送企业微信通知
        if: always()
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          STATUS: ${{ steps.run-login.outputs.status }}
        run: |
          if [ -z "${WECOM_WEBHOOK}" ]; then
            echo "⚠️ 未配置 WECOM_WEBHOOK，跳过通知"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M:%S")
          EXIT_IP="${{ steps.gost.outputs.EXIT_IP }}"
          if [ "$STATUS" = "success" ]; then
            TITLE="✅ noprofit 自动登录成功"
            DESC="Camoufox 反检测引擎已通过 Cloudflare 验证，账号保活成功"
          else
            TITLE="❌ noprofit 自动登录失败"
            DESC="登录失败，请下载录制视频排查问题"
          fi
          echo "📤 正在发送企业微信通知..."
          curl -sS --max-time 15 --noproxy "*" \
            -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "${WECOM_WEBHOOK}" <<EOF
          {
            "msgtype": "markdown",
            "markdown": {
              "content": "## ${TITLE}\n> 🦊 引擎: Camoufox 反检测浏览器\n> 运行时间: <font color=\"comment\">${RUN_TIME} (北京时间)</font>\n> 代理出口 IP: <font color=\"comment\">${EXIT_IP}</font>\n> ${DESC}\n\n[🔗 点击查看运行详情](${RUN_URL})\n[🎥 下载操作录制视频排查问题](${RUN_URL}#artifacts)"
            }
          }
          EOF
          echo ""
          echo "✅ 通知已发送"

      - name: 📦 上传操作录制和日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-recording-${{ github.run_id }}
          path: |
            recordings/
            gost.log
            login-output.log
          retention-days: 30
          if-no-files-found: warn
